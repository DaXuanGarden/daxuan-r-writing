<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Daxuan R writing adaptation map</title>
  <desc id="desc">Reference materials are interpreted by an adaptation layer and turned into project-ready R code with checks and explicit assumptions.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="860" fill="#f4f6f9"/>
  <rect x="42" y="34" width="1316" height="792" rx="26" fill="#ffffff" stroke="#dce2eb" stroke-width="2"/>

  <rect x="42" y="34" width="1316" height="154" rx="26" fill="#172033"/>
  <rect x="42" y="154" width="1316" height="34" fill="#172033"/>
  <circle cx="1120" cy="92" r="8" fill="#36b7a5"/>
  <circle cx="1150" cy="92" r="8" fill="#f4b45f"/>
  <circle cx="1180" cy="92" r="8" fill="#7da4ee"/>
  <text x="92" y="96" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">Daxuan R writing</text>
  <text x="92" y="137" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">REFERENCE → ADAPT → WRITE → CHECK</text>
  <text x="1280" y="138" text-anchor="end" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">R implementation layer</text>

  <text x="92" y="238" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">THE IDEA</text>
  <text x="92" y="275" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">把参考材料接到当前项目</text>
  <text x="92" y="306" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">对象含义、项目参数和最终判断不会被外部代码带走。</text>

  <rect x="92" y="350" width="330" height="260" rx="18" fill="#f1f6ff" stroke="#b8caf1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="126" cy="388" r="19" fill="#3567c8"/>
  <text x="126" y="395" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">01</text>
  <text x="162" y="395" fill="#23458f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">参考材料</text>
  <text x="126" y="444" fill="#273b5d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">脚本 · 函数 · notebook</text>
  <text x="126" y="479" fill="#273b5d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">数据 · 对象 · 报错信息</text>
  <text x="126" y="514" fill="#273b5d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">目标 · 参数 · 输出要求</text>
  <line x1="126" y1="550" x2="388" y2="550" stroke="#b8caf1" stroke-width="2"/>
  <text x="126" y="581" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">先读懂，再决定改动范围</text>

  <path d="M446 480 H502" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M490 469 L508 480 L490 491" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <rect x="524" y="326" width="352" height="308" rx="18" fill="#eefaf7" stroke="#65b7a7" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="562" cy="364" r="19" fill="#128277"/>
  <text x="562" y="371" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">02</text>
  <text x="598" y="371" fill="#0f665f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">适配层</text>
  <text x="562" y="423" fill="#26433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">识别对象：表 · 矩阵 · Seurat</text>
  <text x="562" y="459" fill="#26433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">对齐接口：ID · 维度 · 时间</text>
  <text x="562" y="495" fill="#26433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">区分写法：可复用 · 待确认</text>
  <text x="562" y="531" fill="#26433f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">选择助手：只引入必要部分</text>
  <line x1="562" y1="566" x2="838" y2="566" stroke="#65b7a7" stroke-width="2"/>
  <text x="562" y="598" fill="#52726e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">不把示例假设改名成项目结论</text>

  <path d="M900 480 H956" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <path d="M944 469 L962 480 L944 491" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <rect x="978" y="350" width="330" height="260" rx="18" fill="#fff6ec" stroke="#efbd86" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1012" cy="388" r="19" fill="#c76a2b"/>
  <text x="1012" y="395" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">03</text>
  <text x="1048" y="395" fill="#994718" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">项目结果</text>
  <text x="1012" y="444" fill="#523727" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">能运行的 R 脚本或对象</text>
  <text x="1012" y="479" fill="#523727" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">清楚的输入、输出和假设</text>
  <text x="1012" y="514" fill="#523727" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">与任务相称的检查结果</text>
  <line x1="1012" y1="550" x2="1274" y2="550" stroke="#efbd86" stroke-width="2"/>
  <text x="1012" y="581" fill="#80634e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">知道做了什么，也知道没验证什么</text>

  <line x1="92" y1="684" x2="1308" y2="684" stroke="#e2e8f0" stroke-width="2"/>
  <text x="92" y="726" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">同一套思路，面对不同对象</text>

  <rect x="92" y="753" width="214" height="48" rx="24" fill="#f1f5f9"/>
  <text x="199" y="784" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">临床表格</text>
  <rect x="324" y="753" width="214" height="48" rx="24" fill="#f1f5f9"/>
  <text x="431" y="784" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">GWAS / 遗传学</text>
  <rect x="556" y="753" width="214" height="48" rx="24" fill="#f1f5f9"/>
  <text x="663" y="784" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">bulk 组学</text>
  <rect x="788" y="753" width="214" height="48" rx="24" fill="#f1f5f9"/>
  <text x="895" y="784" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">单细胞 / 空间</text>
  <rect x="1020" y="753" width="288" height="48" rx="24" fill="#f1f5f9"/>
  <text x="1164" y="784" text-anchor="middle" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">多组学 / 其他 R 材料</text>
</svg>
